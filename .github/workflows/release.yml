name: Build & Release

# Push a version tag (e.g. `git tag v0.3.0 && git push --tags`) and GitHub builds
# the Windows exe and publishes it as a release automatically.
on:
  push:
    tags: ["release-*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build nullsec.exe
        run: pyinstaller nullsec.spec --clean --noconfirm

      - name: Publish release with the exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nullsec.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
